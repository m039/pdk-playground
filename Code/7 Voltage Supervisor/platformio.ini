; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/m039/pdk-platformio.git
framework = easypdk
board_build.f_cpu = 1000000
board_build.calibration_voltage = 2.2      # voltage in volt used for calibration (default=4.0)

; Voltage Supervisor threshold configuration (Comparator Case 4):
; Options from adc.h:
;   ADC_VOLTAGE_2V40 (24) - 2.40 V (N = 15)
;   ADC_VOLTAGE_2V56 (25) - 2.56 V (N = 14)
;   ADC_VOLTAGE_2V74 (27) - 2.74 V (N = 13)
;   ADC_VOLTAGE_2V95 (29) - 2.95 V (N = 12)
;   ADC_VOLTAGE_3V20 (32) - 3.20 V (N = 11)
;   ADC_VOLTAGE_3V49 (34) - 3.49 V (N = 10)
;   ADC_VOLTAGE_3V84 (38) - 3.84 V (N =  9)
;   ADC_VOLTAGE_4V27 (42) - 4.27 V (N =  8)
;   ADC_VOLTAGE_4V80 (48) - 4.80 V (N =  7)
;   ADC_VOLTAGE_5V49 (54) - 5.49 V (N =  6)
build_flags =
    -DADC_VOLTAGE_THRESHOLD=ADC_VOLTAGE_3V20


[env:pfs154]
board = pfs154

[env:pms150c]
board = pms150c

#board_build.calibration_voltage = 4.0      # voltage in volt used for calibration (default=4.0)
#board_build.f_cpu = 8000000                # frequency in Hz (default=1000000)
#upload_port = /dev/tty1                    # only define a port if auto port detection should not be used
